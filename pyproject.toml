# Root dev environment: test runner and libraries for the shared code and tooling.
# It is NOT deployed. Each runtime ships its own pyproject.toml under app/<runtime>/.
[project]
name = "ctfagents-dev"
version = "0.0.0"
description = "Dev and test environment for the ctfagents AgentCore fleet"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fastapi>=0.115",
    "boto3>=1.35",
    "boto3-stubs[sagemaker-runtime,ssm]>=1.35",
    # Runtime libraries imported by shared/ctf_common and the ports (tests run against the real APIs).
    "strands-agents>=1.59",
    "bedrock-agentcore[strands-agents]>=1.24.1",
    "mcp>=1.28.1,<2",
    "ruff>=0.6",
    "strands-harness>=0.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "spikes/tests"]
# `shared` comes first so tests import the source of truth, never a vendored copy.
# Per-runtime directories are added as each runtime is ported. The SageMaker adapter is NOT a runtime: it is
# only importable here so its tests run; its dependencies never enter the agent runtimes.
pythonpath = [
    "shared",
    "scripts",
    "app/harness_sdk",
    "app/harness",
    "app/strand_decider",
    "app/decider_loop",
    "infra/decider/adapter",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["local", "spikes", "app/*/ctf_common"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "ctf_common",
    "sdk_agent",
    "harness_agent",
    "strand_agent",
    "gate",
    "loop",
    "loop_logic",
    "adapter",
    "hash_source",
    "sync_common",
    "fake_mcp",
    "fake_model",
]

[tool.pyright]
# Keep in sync with [tool.pytest.ini_options].pythonpath so the IDE resolves ctf_common in tests.
include = ["shared", "tests", "scripts", "app", "infra/decider/adapter"]
exclude = ["local", "spikes", "**/__pycache__", "**/.venv", "app/*/ctf_common"]
extraPaths = ["shared", "scripts", "app/harness_sdk", "app/harness", "app/strand_decider", "app/decider_loop", "infra/decider/adapter"]
venvPath = "."
venv = ".venv"
