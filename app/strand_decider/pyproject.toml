[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strand_decider"
version = "0.1.0"
description = "CTF character whose tag and grab_flag calls are reviewed by the SageMaker decider (AgentCore Runtime, CodeZip)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.24.1",
    "boto3 >= 1.35",
    "botocore[crt] >= 1.35.0",
    "httpx >= 0.27",
    "mcp >= 1.28.1, < 2.0.0",
    # >= 1.61: AfterToolsEvent.end_turn (used by StopRequestedHook) was verified on 1.61.
    "strands-agents >= 1.61",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
